name: drape
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  flutter_native_splash: ^2.4.3
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/seed_data.json

# ── App Icon ──────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1816"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false

# ── Splash Screen ─────────────────────────────────────────────
flutter_native_splash:
  color: "#1A1816"
  image: "assets/icon/app_icon.png"
  image_dark: "assets/icon/app_icon.png"
  color_dark: "#1A1816"
  android_12:
    image: "assets/icon/app_icon.png"
    color: "#1A1816"
    icon_background_color: "#1A1816"
  ios: true
  android: true
